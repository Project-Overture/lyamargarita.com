<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lya margarita</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/flowbite@latest/dist/flowbite.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet" />
  <script src="https://kit.fontawesome.com/f1b0fc90bb.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="styles.css" />
  <script src="lyamargarita.js" defer></script>
</head>

<!-- Added 'flex flex-col' to the body to manage vertical layout -->
<body class="relative min-h-screen flex flex-col">
  <div id="hearts-container" class="hearts-container"></div>
  
  <!-- Added 'justify-center' and changed 'w-full' to 'my-auto' or left flex-1 to handle the vertical push -->
  <div class="relative z-10 flex flex-col items-center justify-center flex-1 w-full px-4 py-12 space-y-12">
    <header class="text-center">
      <h1 class="font-[Pacifico] text-4xl sm:text-5xl md:text-6xl text-pink-700 mb-10 leading-tight">
        hi, i'm lyamargarita!
      </h1>
      <div class="flex flex-wrap justify-center gap-4 sm:gap-6">
        <a href="https://twitch.tv/lyamargarita" target="_blank" aria-label="twitch"
          class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-pink-700 flex items-center justify-center hover:bg-pink-800 transition-colors">
          <img src="https://cdn.simpleicons.org/twitch/ffffff" alt="twitch" class="w-6 h-6 sm:w-8 sm:h-8" />
        </a>
        <a href="https://youtube.com/lyamargarita" target="_blank" aria-label="youtube"
          class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-pink-700 flex items-center justify-center hover:bg-pink-800 transition-colors">
          <img src="https://cdn.simpleicons.org/youtube/ffffff" alt="youtube" class="w-6 h-6 sm:w-8 sm:h-8" />
        </a>
        <a href="https://twitter.com/lyamargaritaa" target="_blank" aria-label="x (twitter)"
          class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-pink-700 flex items-center justify-center hover:bg-pink-800 transition-colors">
          <img src="https://cdn.simpleicons.org/x/ffffff" alt="x-twitter" class="w-6 h-6 sm:w-8 sm:h-8" />
        </a>
        <a href="https://discord.lyamargarita.com" target="_blank" aria-label="discord"
          class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-pink-700 flex items-center justify-center hover:bg-pink-800 transition-colors">
          <img src="https://cdn.simpleicons.org/discord/ffffff" alt="discord" class="w-6 h-6 sm:w-8 sm:h-8" />
        </a>
      </div>
    </header>
    <footer class="text-center text-sm text-gray-700">
      <p>
        made with <span class="text-pink-500">&hearts;</span> by lyamargarita
        &amp; friends
      </p>
    </footer>
  </div>
</body>

</html>
